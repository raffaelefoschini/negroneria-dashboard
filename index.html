<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Negroneria">
<title>La Negroneria — Dashboard</title>
<style>
  :root {
    --bg: #0f0f12;
    --card-bg: #1a1a1f;
    --card-border: #2a2a30;
    --text: #f2f2f0;
    --text-dim: #9a9a9f;
    --accent: #c9a24b;
    --rosso: #e05a4e;
    --giallo: #d9a441;
    --verde: #5cb37a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  header h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: 0.3px; }
  header .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  #refresh-btn {
    background: var(--card-bg); border: 1px solid var(--card-border);
    color: var(--text); border-radius: 10px; padding: 9px 12px;
    font-size: 13px; display: flex; align-items: center; gap: 6px;
  }
  #refresh-btn:active { opacity: 0.6; }
  #refresh-btn svg { width: 14px; height: 14px; }
  #refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 16px; margin-bottom: 12px;
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-dim); margin: 0 0 10px;
  }

  .oggi-ieri { display: flex; gap: 12px; }
  .oggi-ieri .col { flex: 1; }
  .oggi-ieri .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .oggi-ieri .valore { font-size: 26px; font-weight: 700; }
  .oggi-ieri .valore.oggi { color: var(--accent); }
  .oggi-ieri .n { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .divider { width: 1px; background: var(--card-border); }

  .stat-row { display: flex; justify-content: space-between; align-items: baseline; }
  .stat-row .valore { font-size: 22px; font-weight: 700; }
  .stat-row .n { font-size: 13px; color: var(--text-dim); }

  .stock-list { display: flex; flex-direction: column; gap: 8px; }
  .stock-item {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; padding: 4px 0;
  }
  .badge {
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
  }
  .badge.sotto { background: rgba(224,90,78,0.18); color: var(--rosso); }
  .badge.vicino { background: rgba(217,164,65,0.18); color: var(--giallo); }
  .stock-empty { color: var(--text-dim); font-size: 13px; }

  .fasce { display: flex; align-items: flex-end; gap: 3px; height: 70px; margin-top: 4px; }
  .fasce .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .fasce .bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
  .fasce .ora { font-size: 8px; color: var(--text-dim); margin-top: 3px; }

  #stato {
    text-align: center; color: var(--text-dim); font-size: 13px;
    padding: 40px 20px;
  }
  #contenuto { display: none; }
  #contenuto.visibile { display: block; }

  footer { text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>La Negroneria</h1>
      <div class="sub" id="ultimo-agg">—</div>
    </div>
    <button id="refresh-btn" onclick="carica(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v6h-6"/></svg>
      Aggiorna
    </button>
  </header>

  <div id="stato">Carico i dati...</div>

  <div id="contenuto">
    <div class="card">
      <h2>Fatturato</h2>
      <div class="oggi-ieri">
        <div class="col">
          <div class="label" id="lbl-oggi">Oggi</div>
          <div class="valore oggi" id="fatt-oggi">—</div>
          <div class="n" id="n-oggi">—</div>
        </div>
        <div class="divider"></div>
        <div class="col">
          <div class="label" id="lbl-ieri">Ieri</div>
          <div class="valore" id="fatt-ieri">—</div>
          <div class="n" id="n-ieri">—</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Andamento di oggi</h2>
      <div class="fasce" id="fasce"></div>
    </div>

    <div class="card">
      <h2>Vendite sospese oggi</h2>
      <div class="stat-row">
        <div class="valore" id="sospese-valore">—</div>
        <div class="n" id="sospese-n">—</div>
      </div>
    </div>

    <div class="card">
      <h2>Scorte da controllare</h2>
      <div class="stock-list" id="stock-list"></div>
    </div>
  </div>

  <footer>Dati aggiornati ad ogni sincronizzazione oraria con Moloni. <a href="storico.html" style="color:var(--accent);text-decoration:none;">Vai allo storico →</a></footer>
</div>

<script>
// Incolla qui l'URL del tab "Dashboard_Live" pubblicato come CSV
// (Google Sheets -> File -> Condividi -> Pubblica sul web -> seleziona
// il tab "Dashboard_Live" -> formato CSV -> Pubblica -> copia il link).
const CSV_URL = "INCOLLA_QUI_URL_CSV_PUBBLICATO";

function formattaEuro(v) {
  return "€ " + Number(v).toFixed(2).replace(".", ",");
}

// Il tab pubblicato contiene UNA sola cella con una stringa JSON: il CSV
// esportato da Google la restituisce quindi come un'unica riga, tra
// virgolette (perche' contiene virgole), con le virgolette interne
// raddoppiate per lo standard CSV. Bastano poche righe per "sbustarla"
// invece di scrivere un parser CSV completo per una tabella vera.
// Parser generico per la riga CSV pubblicata: gestisce sia una singola
// cella quotata sia piu' celle sulla stessa riga (usato da storico.html
// quando il JSON supera i 50.000 caratteri consentiti in una cella singola
// - qui il dato e' piccolo e sta sempre in una cella sola, ma la stessa
// funzione robusta evita di doverne mantenere due versioni diverse).
function estraiJsonDaCsv(testo) {
  const t = testo.trim();
  const campi = [];
  let corrente = "";
  let dentroVirgolette = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (dentroVirgolette) {
      if (c === '"') {
        if (t[i + 1] === '"') { corrente += '"'; i++; }
        else { dentroVirgolette = false; }
      } else {
        corrente += c;
      }
    } else if (c === '"') {
      dentroVirgolette = true;
    } else if (c === ",") {
      campi.push(corrente);
      corrente = "";
    } else if (c === "\r" || c === "\n") {
      // fine riga: ignorata (non dovrebbe comparire dentro un campo quotato)
    } else {
      corrente += c;
    }
  }
  campi.push(corrente);
  return JSON.parse(campi.join(""));
}

function renderFasce(fasce) {
  const cont = document.getElementById("fasce");
  cont.innerHTML = "";
  if (!fasce || fasce.length === 0) {
    cont.innerHTML = '<div class="stock-empty">Ancora nessuna vendita oggi.</div>';
    return;
  }
  const max = Math.max(...fasce.map(f => f.valore), 1);
  fasce.forEach(f => {
    const wrap = document.createElement("div");
    wrap.className = "bar-wrap";
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = Math.max(4, Math.round((f.valore / max) * 100)) + "%";
    bar.title = f.ora + ":00 — " + formattaEuro(f.valore);
    const label = document.createElement("div");
    label.className = "ora";
    label.textContent = f.ora;
    wrap.appendChild(bar);
    wrap.appendChild(label);
    cont.appendChild(wrap);
  });
}

function renderStock(lista) {
  const cont = document.getElementById("stock-list");
  cont.innerHTML = "";
  if (!lista || lista.length === 0) {
    cont.innerHTML = '<div class="stock-empty">Tutto sopra soglia, nessun avviso.</div>';
    return;
  }
  lista.forEach(item => {
    const row = document.createElement("div");
    row.className = "stock-item";
    const nome = document.createElement("span");
    nome.textContent = item.nome;
    const badge = document.createElement("span");
    badge.className = "badge " + (item.livello === "SOTTO SOGLIA" ? "sotto" : "vicino");
    badge.textContent = item.livello === "SOTTO SOGLIA" ? "Sotto soglia" : "Vicino soglia";
    row.appendChild(nome);
    row.appendChild(badge);
    cont.appendChild(row);
  });
}

function render(d) {
  document.getElementById("ultimo-agg").textContent = "Aggiornato " + d.ultimo_aggiornamento;

  document.getElementById("lbl-oggi").textContent = "Oggi";
  document.getElementById("fatt-oggi").textContent = formattaEuro(d.oggi.fatturato_gross);
  document.getElementById("n-oggi").textContent = d.oggi.n_vendite + " vendite";

  document.getElementById("lbl-ieri").textContent = "Ieri (" + d.ieri.data + ")";
  document.getElementById("fatt-ieri").textContent = formattaEuro(d.ieri.fatturato_gross);
  document.getElementById("n-ieri").textContent = d.ieri.n_vendite + " vendite";

  renderFasce(d.fasce_oggi);

  document.getElementById("sospese-valore").textContent = formattaEuro(d.sospese_oggi.valore);
  document.getElementById("sospese-n").textContent = d.sospese_oggi.n + " conti";

  renderStock(d.stock_critico);

  document.getElementById("stato").style.display = "none";
  document.getElementById("contenuto").classList.add("visibile");
}

async function carica(manuale) {
  const btn = document.getElementById("refresh-btn");
  if (manuale) btn.classList.add("spinning");
  try {
    if (!CSV_URL || CSV_URL.indexOf("INCOLLA_QUI") !== -1) {
      document.getElementById("stato").textContent =
        "Configurazione mancante: apri index.html e incolla l'URL CSV pubblicato dentro CSV_URL.";
      document.getElementById("stato").style.display = "block";
      return;
    }
    const res = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const testo = await res.text();
    const dati = estraiJsonDaCsv(testo);
    render(dati);
  } catch (e) {
    document.getElementById("stato").textContent = "Errore nel caricamento dei dati: " + e.message;
    document.getElementById("stato").style.display = "block";
    document.getElementById("contenuto").classList.remove("visibile");
  } finally {
    btn.classList.remove("spinning");
  }
}

carica(false);
// Ri-aggiorna da solo ogni 5 minuti se la pagina resta aperta.
setInterval(() => carica(false), 5 * 60 * 1000);
</script>
</body>
</html>
